project:
  type: website
  pre-render:
    - publications.r
  resources:
    - _headers
    - landing
  render:
    - "*.qmd"
    - "*.en.qmd"
    - "*.zh.qmd"
    - "posts/**/*.en.qmd"
    - "posts/**/*.zh.qmd"
    - "posts/**/*.en.md"
    - "posts/**/*.zh.md"
    - "AIDD/**/*.en.md"
    - "AIDD/**/*.zh.md"
    - "AIDD/**/*.en.qmd"
    - "AIDD/**/*.zh.qmd"
    - "!drafts/"

website:
  title: "MPU"
  description: "A data science blog and portfolio by Jixing Liu"
  favicon: /assets/images/cabin.png
  image: /assets/images/social-profile.png
  site-url: https://jixing.liu.fr
  repo-url: https://github.com/jixing475/jixing.liu.fr
  repo-actions: [edit, issue]
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  comments: false
  page-footer:
    border: true
    left: |
      Powered by [{{< iconify simple-icons:quarto >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} Jixing Liu. [{{< iconify octicon:heart-fill-16 >}} Sponsor](https://github.com/sponsors/jixing475?o=esb).
    right: |
      License: [CC BY NC SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).
  navbar:
    title: "MPU"
    search: true
    logo: assets/images/cabin.png
    right:
      - text: About
        href: index.qmd
      - text: Blog
        href: blog.en.qmd
      - text: AIDD
        href: aidd.en.qmd
      - text: Services
        menu:
          - text: "💰 计算服务报价 (中文)"
            href: landing/pricing.zh.html
          - text: "💰 Pricing (English)"
            href: landing/pricing.en.html

format:
  html:
    theme:
      - cosmo
      - assets/simon-light.scss
      - assets/simon.scss
    lang: en
    date-format: 'dddd[, the] Do [of] MMMM, YYYY'
    highlight-style: github-dark
    code-copy: true
    code-link: true
    anchor-sections: true
    email-obfuscation: javascript
    link-external-newwindow: true
    fig-align: center
    code-tools:
      source: false
      toggle: false
      caption: none
    include-in-header:
      - text: |
          <style>
          .language-switcher {
            position: fixed;
            top: 70px;
            right: 30px;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
          }
          .language-switcher a {
            margin: 0 5px;
            text-decoration: none;
            color: #0066cc;
          }
          .language-switcher a:hover {
            text-decoration: underline;
          }
          </style>
      - text: |
          <script>
          document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            const switcher = document.createElement('div');
            switcher.className = 'language-switcher';

            // 判断当前是否为中文页面
            const isChinese = path.includes('.zh.');

            let enPath, zhPath;

            if (isChinese) {
              // 当前是中文，生成英文链接
              enPath = path.replace('.zh.', '.en.');
              switcher.innerHTML = '<a href="' + enPath + '">EN</a> | <strong>中文</strong>';
            } else if (path.includes('.en.')) {
              // 当前是英文
              zhPath = path.replace('.en.', '.zh.');
              switcher.innerHTML = '<strong>EN</strong> | <a href="' + zhPath + '">中文</a>';
            } else {
              // 默认页面（如 index.html），假设为英文
              const basePath = path.replace('.html', '');
              zhPath = basePath + '.zh.html';
              switcher.innerHTML = '<strong>EN</strong> | <a href="' + zhPath + '">中文</a>';
            }

            document.body.appendChild(switcher);
          });
          </script>
    include-after-body:
      - text: |
          <script type="text/javascript">
            const dateElements = document.querySelectorAll("p.date, div.listing-date, div.listing-file-modified");
            dateElements.forEach((el) => {
              el.innerHTML = el.innerHTML.replace(
                /(\d+)(st|nd|rd|th)/g,
                "$1<sup style='font-size:0.5em;font-style:italic;'>$2</sup>"
              );
            });
          </script>
          <script>
            document.getElementById('current-year').textContent = new Date().getFullYear();
          </script>

lightbox: auto

execute:
  freeze: true
